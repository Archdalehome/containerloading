<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>手动装柜原型 · 拖放与吸附</title>
<style>
  body { margin: 0; background: #0f172a; color: #e2e8f0; font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; }
  #hud { position: fixed; left: 16px; top: 14px; z-index: 2; background: rgba(15,23,42,.82); padding: 10px 14px; border-radius: 10px; }
  #hud b { color: #7dd3fc; }
  #status { position: fixed; left: 16px; bottom: 16px; z-index: 2; background: rgba(15,23,42,.82); padding: 8px 14px; border-radius: 10px; min-width: 260px; }
  #status.bad { background: rgba(127,29,29,.9); }
  canvas { display: block; }
  /* 左栏：箱型列表与新建表单 */
  #side { position: fixed; left: 16px; top: 132px; z-index: 3; width: 290px; max-height: calc(100vh - 210px); overflow: auto;
          background: rgba(15,23,42,.9); border: 1px solid #1e293b; border-radius: 10px; padding: 10px 12px; }
  #side h3 { margin: 0 0 8px; font-size: 13px; color: #7dd3fc; font-weight: 600; }
  .btn { background: #1e3a8a; color: #e2e8f0; border: 1px solid #2563eb; border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  .btn:hover { background: #1d4ed8; }
  .btn.ghost { background: transparent; border-color: #334155; }
  .sku { border: 1px solid #1e293b; border-radius: 8px; padding: 7px 9px; margin-bottom: 7px; cursor: pointer; }
  .sku.on { border-color: #f59e0b; background: rgba(245,158,11,.08); }
  .sku .nm { font-size: 13px; color: #e2e8f0; display: flex; align-items: center; gap: 6px; }
  .sku .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .sku .meta { font-size: 12px; color: #94a3b8; }
  .sku .row2 { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
  .sku .cnt { margin-left: auto; font-size: 12px; color: #7dd3fc; }
  #empty { color: #94a3b8; font-size: 12px; line-height: 1.7; margin: 6px 0 10px; }
  #form { display: none; border-top: 1px dashed #334155; margin-top: 8px; padding-top: 8px; }
  #form.on { display: block; }
  #form .fld { display: flex; gap: 6px; margin-bottom: 6px; }
  #form label { font-size: 12px; color: #94a3b8; width: 84px; flex: none; line-height: 26px; }
  #form input, #form select { background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 5px; padding: 3px 6px; width: 100%; font: inherit; }
  #form .err { color: #fca5a5; font-size: 12px; min-height: 16px; }
  #shapes { display: flex; gap: 6px; margin-bottom: 6px; }
  #shapes button { flex: 1; background: #0f172a; color: #cbd5e1; border: 1px solid #334155; border-radius: 5px; padding: 4px 0; cursor: pointer; font: inherit; }
  #shapes button.on { border-color: #38bdf8; color: #38bdf8; }
</style>
</head>
<body>
<div id="hud">
  手动装柜原型 · 拖一只箱子：松手会<b>沉降 + 吸附</b>，越界或重叠会<b>回弹</b>并写明原因
  <div style="margin-top:6px;font-size:13px">
    柜型：<select id="ctn">
      <option>20GP</option><option>40GP</option><option>40HQ</option><option>45HQ</option>
    </select>
    <span id="dims" style="color:#94a3b8;margin-left:8px"></span>
  </div>
  <div style="margin-top:6px;font-size:13px">
    选中后：<button id="rx">绕 X</button> <button id="ry">绕 Y</button> <button id="rz">绕 Z</button>
    <button id="cp">复制</button> <button id="un">撤销</button>
    <button id="pair">对扣</button>
    <span style="color:#94a3b8">（键：1/2/3 旋转 · Ctrl+C/V 复制 · Ctrl+Z 撤销）</span>
  </div>
  <div id="count" style="margin-top:6px;font-size:13px;color:#7dd3fc"></div>
</div>
<div id="side">
  <h3>纸箱清单</h3>
  <div id="empty">还没有箱型。点下面「＋ 新建箱型」加一个，再点列表里的 <b>＋</b> 就往柜里放一只。</div>
  <div id="sku-list"></div>
  <button class="btn" id="new-sku" style="width:100%">＋ 新建箱型</button>
  <div id="form">
    <div id="shapes">
      <button type="button" data-shape="rect">矩形箱</button>
      <button type="button" data-shape="lshape">L 形箱</button>
      <button type="button" data-shape="slope">斜顶箱</button>
    </div>
    <div class="fld"><label>名称</label><input id="f-name" placeholder="例如 吧椅 / 茶几"></div>
    <div id="fields"></div>
    <div class="fld"><label>数量</label><input id="f-qty" value="10" inputmode="numeric"></div>
    <div class="err" id="f-err"></div>
    <div class="fld" style="gap:8px">
      <button class="btn" id="f-save" style="flex:1">保存</button>
      <button class="btn ghost" id="f-cancel" style="flex:1">取消</button>
    </div>
  </div>
</div>
<div id="status">状态：待拖动</div>
<div id="stat2" style="position:fixed;right:16px;top:14px;z-index:2;background:rgba(15,23,42,.82);padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.7"></div>
<script>
  // 错误兜底：页面出任何错都写到状态栏，截图就能看到原因
  window.__errs = [];
  function showErr(msg) {
    window.__errs.push(msg);
    var el = document.getElementById('status');
    if (el) { el.textContent = '脚本错误：' + msg; el.className = 'bad'; }
    var s2 = document.getElementById('stat2');
    if (s2) s2.textContent = '脚本错误：' + msg;
  }
  window.onerror = function (m, src, line, col) { showErr(m + ' @' + (src || '') + ':' + line + ':' + col); };
  window.addEventListener('unhandledrejection', function (e) {
    showErr((e.reason && (e.reason.message || e.reason)) || 'unknown rejection');
  });
</script>
<script src="js/core/shapes.js"></script>
<script src="js/core/containers.js"></script>
<script src="js/core/solid.js"></script>
<script src="js/core/pack.js"></script>
<script src="js/core/manual.js"></script>
<script src="js/core/manual-model.js"></script>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
import { geometryFor, poseMatrix3, matrix4FromR3 } from './js/ui/box-geometry.js';

// 柜型切换：换柜型直接带参数重载，线框 / 相机取景 / 射线平面 / 标注一起重建，
// 不留半新半旧的场景状态。柜型确定 = 尺寸确定，本来就该整场重建。
const ctnKey = new URLSearchParams(location.search).get('container') || '40HQ';
const ctnSel = document.getElementById('ctn');
if (ctnSel) {
  ctnSel.value = ctnKey;
  // 切柜型：只重建渲染对象（线框/地面/相机/标注），数据模型原地保留，
  // 已摆的箱子一个都不丢；重建后重新校验，越界的标红。
  ctnSel.addEventListener('change', () => {
    c = CL.containers.get(ctnSel.value);
    model.container = c;
    paintDims();
    rebuildScene();
    revalidate();
    selected = null;
    refreshAll();
    say('已切到 ' + ctnSel.value + '：' + c.innerL + '×' + c.innerW + '×' + c.innerH);
  });
}
let c = CL.containers.get(ctnKey);
function paintDims() {
  document.getElementById('dims').textContent =
    '内长 ' + c.innerL + ' × 内宽 ' + c.innerW + ' × 内高 ' + c.innerH + ' · 门高 ' + c.doorH;
}
paintDims();
const statusEl = document.getElementById('status');
const say = (msg, bad) => {
  statusEl.textContent = '状态：' + msg;
  statusEl.className = bad ? 'bad' : '';
};

// ---- 场景 ----
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 10, 80000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

let L = c.innerL, H = c.innerH, W = c.innerW;
const toScene = (x, y, z) => new THREE.Vector3(x - L / 2, y, z - W / 2);

// 柜体线框 + 地平面放在一个组里，切柜型时整组重建
const world = new THREE.Group();
scene.add(world);
let floor = null;
function rebuildScene() {
  while (world.children.length) {
    const o = world.children.pop();
    if (o.geometry) o.geometry.dispose();
  }
  L = c.innerL; H = c.innerH; W = c.innerW;
  world.add(new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(L, H, W)),
    new THREE.LineBasicMaterial({ color: 0x38bdf8 })
  ).translateY(H / 2));
  floor = new THREE.Mesh(
    new THREE.PlaneGeometry(L, W),
    new THREE.MeshBasicMaterial({ color: 0x1e293b, transparent: true, opacity: 0.55, side: THREE.DoubleSide })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(0, 0, 0);
  floor.name = 'floor';
  world.add(floor);
  // 相机按新内腔重新取景
  camera.position.set(L * 0.85, H * 2.6, W * 3.2);
  camera.lookAt(0, H / 2, 0);
}
rebuildScene();

// 模型从空箱型开始，箱型一律由左栏新建；这里的网格只是模型的投影
const model = CL.manualModel.create([], c);
const itemsById = model.itemsById;

// 三种箱型的几何共用 js/ui/box-geometry.js，和正式页同一份代码
const geoCache = new Map();
function geoFor(skuId, pose) {
  const key = skuId + '|' + (pose ? pose.join(',') : '');
  if (!geoCache.has(key)) {
    const it = itemsById[skuId];
    const g = geometryFor(it);
    if (pose) g.applyMatrix4(matrix4FromR3(poseMatrix3(pose)));
    geoCache.set(key, g);
  }
  return geoCache.get(key);
}
const PALETTE = ['#2563eb', '#0d9488', '#d97706', '#7c3aed', '#db2777', '#65a30d', '#0891b2', '#b45309', '#4f46e5', '#be123c'];
function colorFor(skuId) {
  const it = itemsById[skuId];
  const i = it && typeof it.index === 'number' ? it.index : 0;
  return new THREE.Color(PALETTE[i % PALETTE.length]);
}
const skuMats = new Map();
function matFor(skuId) {
  if (!skuMats.has(skuId)) skuMats.set(skuId, new THREE.MeshLambertMaterial({ color: colorFor(skuId), transparent: true, opacity: 0.92 }));
  return skuMats.get(skuId);
}
const ghostMat = new THREE.MeshLambertMaterial({ color: 0x93c5fd, transparent: true, opacity: 0.55 });
const SELECT_MAT = new THREE.MeshLambertMaterial({ color: 0xf59e0b });
const BAD_MAT = new THREE.MeshLambertMaterial({ color: 0xdc2626 });
scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 1.1));

function meshFor(b) {
  const m = new THREE.Mesh(geoFor(b.skuId, b.pose), matFor(b.skuId));

  m.userData.uid = b.uid;
  m.position.copy(toScene(b.x + b.l / 2, b.z + b.h / 2, b.y + b.w / 2));
  return m;
}
const meshes = new Map();
function syncMesh(b) {
  let m = meshes.get(b.uid);
  if (!m) { m = meshFor(b); meshes.set(b.uid, m); scene.add(m); }
  // 旋转会换姿态矩阵，几何必须跟着换；只改位置会让箱子“看着没转”
  m.geometry = geoFor(b.skuId, b.pose);
  m.position.copy(toScene(b.x + b.l / 2, b.z + b.h / 2, b.y + b.w / 2));
  return m;
}

// 相机：斜上方看整柜
camera.position.set(L * 0.85, H * 2.6, W * 3.2);
camera.lookAt(0, H / 2, 0);

// ---- 拖放 ----
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const dragPlaneHits = [];
let dragging = null;   // { uid, mesh, start, planeY, snapped }
let dragPlane = null;  // 固定高度的拖拽平面（three 的 Y 是高度）
let dragOffset = null; // 抓取点相对箱心的水平偏移，避免一按下箱子就跳到鼠标下
let ghostPos = null;

function setPointer(ev) {
  pointer.x = (ev.clientX / innerWidth) * 2 - 1;
  pointer.y = -(ev.clientY / innerHeight) * 2 + 1;
}

function groundHit() {
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects([floor, ...meshes.values()], false);
  return hits.length ? hits[0].point : null;
}

renderer.domElement.addEventListener('pointerdown', (ev) => {
  setPointer(ev);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects([...meshes.values()], false);
  if (!hits.length) return;
  const uid = hits[0].object.userData.uid;
  const b = model.boxes.find((x) => x.uid === uid);
  // 固定高度的拖拽平面：不管鼠标划过地板、箱顶还是箱侧，箱子都只在同一水平面上跟手走。
  // 之前按“射线打到哪个面”来定位，划过别的箱子就会跳高度，这是难控制的根因。
  const planeY = b.z + b.h / 2;
  dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -planeY);
  const hitPoint = new THREE.Vector3();
  raycaster.ray.intersectPlane(dragPlane, hitPoint);
  dragOffset = new THREE.Vector3(
    hits[0].object.position.x - hitPoint.x, 0, hits[0].object.position.z - hitPoint.z
  );
  dragging = { uid, mesh: hits[0].object, start: b, planeY };
  hits[0].object.material = ghostMat;
  renderer.domElement.setPointerCapture(ev.pointerId);
  say('拖动中…松手会落到下方最高的支撑面上');
});

function containerXY(mesh, b) {
  return { x: mesh.position.x + L / 2 - b.l / 2, y: mesh.position.z + W / 2 - b.w / 2 };
}
const SNAP_TOL = 100;   // 吸附容差：越大越“粘”，100mm 时靠近墙角就有感觉

/** 找出脚下能托住 (l×w) 的最高支撑高度：把同一高度的所有支撑面并起来看（两只箱拼着也能托住） */
function supportRectUnder(placed, h, x, y, l, w) {
  const byZ = new Map();
  placed.forEach((p) => {
    const it = itemsById[p.skuId];
    if (!it || !CL.pack.surfacesOf) return;
    CL.pack.surfacesOf(it, p).forEach((s) => {
      const key = Math.round(s.z * 1000) / 1000;
      if (!byZ.has(key)) byZ.set(key, []);
      byZ.get(key).push(s.rect);
    });
  });
  const zs = Array.from(byZ.keys()).filter((z) => z + h <= c.innerH + 1e-6).sort((a, b) => b - a);
  for (const z of zs) {
    const rects = byZ.get(z);
    // 这一高度的支撑面并集的外接框：箱子贴进去，尽量落在支撑上
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    rects.forEach((r) => {
      const ix = Math.min(x + l, r.x + r.l) - Math.max(x, r.x);
      const iy = Math.min(y + w, r.y + r.w) - Math.max(y, r.y);
      if (ix <= 0 || iy <= 0) return;
      x0 = Math.min(x0, r.x); y0 = Math.min(y0, r.y);
      x1 = Math.max(x1, r.x + r.l); y1 = Math.max(y1, r.y + r.w);
    });
    if (x0 === Infinity) continue;
    const coverW = Math.min(x + l, x1) - Math.max(x, x0);
    const coverH = Math.min(y + w, y1) - Math.max(y, y0);
    if (coverW <= 0 || coverH <= 0) continue;
    return { z, rect: { x: x0, y: y0, l: x1 - x0, w: y1 - y0 } };
  }
  return null;
}

/** 把箱子夹在柜内（拖拽过程中永远不越界），再吸附，最后把网格摆到结果位置 */
function placeGhost(ev) {
  setPointer(ev);
  raycaster.setFromCamera(pointer, camera);
  // 取鼠标正下方真正命中的面（地板或某个箱顶）来定位，而不是固定高度的平面：
  // 用固定平面时，你瞄箱顶、射线却先穿过低平面，落点会偏到箱子后面去，导致永远叠不上。
  const targets = [floor].concat(
    Array.from(meshes.values()).filter((m) => m.userData.uid !== dragging.uid)
  );
  const hits = raycaster.intersectObjects(targets, false);
  const b = dragging.start;
  let cxc, czc;
  if (hits.length) {
    const hp = hits[0].point;
    cxc = hp.x + dragOffset.x + L / 2;
    czc = hp.z + dragOffset.z + W / 2;
  } else {
    // 指向柜外时退回固定平面，避免箱子被甩飞
    const p = new THREE.Vector3();
    if (!raycaster.ray.intersectPlane(dragPlane, p)) return;
    cxc = p.x + dragOffset.x + L / 2;
    czc = p.z + dragOffset.z + W / 2;
  }
  const halfL = b.l / 2, halfW = b.w / 2;
  cxc = Math.min(Math.max(cxc, halfL), L - halfL);
  czc = Math.min(Math.max(czc, halfW), W - halfW);
  const cand = Object.assign({}, b, { x: cxc - halfL, y: czc - halfW });
  const others = model.boxes.filter((o) => o.uid !== dragging.uid);
  const sn = CL.manual.snap(cand, others, c, SNAP_TOL);
  let sx = Math.min(Math.max(sn.box.x, 0), L - b.l);
  let sy = Math.min(Math.max(sn.box.y, 0), W - b.w);

  // 关键一步：把箱子“吸进”下方支撑面的矩形里。
  // 否则靠近箱顶边缘时会在“能叠/压一半”之间来回跳，最后落到半压位置被判重叠。
  const sup = supportRectUnder(others, b.h, sx, sy, b.l, b.w);
  if (sup && sup.rect.l >= b.l - 1e-6 && sup.rect.w >= b.w - 1e-6) {
    sx = Math.min(Math.max(sx, sup.rect.x), sup.rect.x + sup.rect.l - b.l);
    sy = Math.min(Math.max(sy, sup.rect.y), sup.rect.y + sup.rect.w - b.w);
  }

  dragging.snapped = Object.assign({}, sn.box, { x: sx, y: sy });
  // 拖到哪儿就落到哪儿的最高支撑面上：这样“把箱子提起来放到另一个上面”是拖过去松手就成，
  // 而不是只能在原地打转。settle 只认完整托住底面的水平面，所以悬空/半压缺口都不会成立。
  const st = CL.manual.settle(
    Object.assign({}, b, { x: sx, y: sy, z: c.innerH }), others, c, itemsById
  );
  const targetZ = st.ok ? st.z : b.z;
  dragging.targetZ = targetZ;
  dragging.mesh.position.set(sx + halfL - L / 2, targetZ + b.h / 2, sy + halfW - W / 2);
}

renderer.domElement.addEventListener('pointermove', (ev) => {
  if (!dragging) return;
  placeGhost(ev);
});

renderer.domElement.addEventListener('pointerup', (ev) => {
  if (!dragging) return;
  const { uid, mesh, start } = dragging;
  const snappedBox = dragging.snapped;
  dragging = null;
  mesh.material = matFor(start.skuId);
  // 落位用拖动中已经算好的吸附位置（没有就现场再算一次），再交给 tryPlace 做沉降与判定
  const base = snappedBox || Object.assign({}, start, containerXY(mesh, start));
  const input = { skuId: start.skuId, x: base.x, y: base.y, z: c.innerH, l: start.l, w: start.w, h: start.h, pose: start.pose };
  const others = model.boxes.filter((b) => b.uid !== uid);
  // 拖动过程中已经吸附好了，松手时 **不再** 二次吸附：再吸一次会把它挪开几毫米，
  // 正好破坏“完整托住底面”，于是叠箱被误判成放不下并弹回。
  let res = CL.manual.tryPlace(input, others, c, itemsById, { tol: 0 });
  if (!res.ok && (res.reason === 'no-support' || res.reason === 'overlap')) {
    res = CL.manual.tryPlace(input, others, c, itemsById, { tol: SNAP_TOL });
  }
  if (!res.ok) {
    syncMesh(start);                     // 先回弹到原位，再报原因
    if (res.reason === 'no-support') {
      const sup = supportRectUnder(others, start.h, base.x, base.y, start.l, start.w);
      const supTxt = sup ? Math.round(sup.rect.l) + '×' + Math.round(sup.rect.w) : '没有';
      say('放不下：下方支撑面 ' + supTxt + 'mm，托不住 ' + Math.round(start.l) + '×' + Math.round(start.w) + 'mm 的底面（要完整托住才能叠）', true);
    } else {
      say('放不下：' + res.message, true);
    }
    return;
  }
  model.boxes = model.boxes.map((b) => (b.uid === uid ? Object.assign(res.box, { uid }) : b));
  refreshAll();   // 里面会做重力结算：被拖走后上面悬空的箱子要落下来
  const snapped = res.snaps && res.snaps.length
    ? '，已贴齐 ' + res.snaps.map((s) => s.axis.toUpperCase() + (s.delta > 0 ? '+' : '') + Math.round(s.delta) + 'mm').join(' / ')
    : '';
  say('已落位：x=' + Math.round(res.box.x) + ' y=' + Math.round(res.box.y) + ' z=' + Math.round(res.box.z) + snapped);
});

function tick() {
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---- Step 2：选中 / 旋转 / 复制 / 撤销 / 计数 ----
let selected = null;
const SELECT_COLOR = 0xf59e0b;
const BASE_COLOR = 0x2563eb;

function paintSelection() {
  meshes.forEach((m, uid) => {
    if (uid === selected) { m.material = SELECT_MAT; return; }
    const b = model.boxes.find((x) => x.uid === uid);
    m.material = b && b.invalid ? BAD_MAT : matFor(b ? b.skuId : 'x');
  });
}

/** 重力结算：自下而上让每只箱子重新落到它当下的支撑面上。
 *  拖走下面那只、删掉一只、转完姿态之后都要跑，否则上面的箱子会悬在空中——违反常识。 */
function resettleAll() {
  const sorted = model.boxes.slice().sort((a, b) => a.z - b.z);
  const done = [];
  sorted.forEach((b) => {
    if (b.pinned) { done.push(b); return; }   // 对扣上件：位置由对扣决定，不能重算
    const st = CL.manual.settle(Object.assign({}, b, { z: c.innerH }), done, c, itemsById);
    if (st.ok) { b.z = st.z; b.invalid = false; }
    else { b.z = 0; b.invalid = true; }   // 没有任何支撑就掉到地上，标红让人看见
    done.push(b);
  });
}

function refreshAll() {
  // 先做重力结算：拖走/删掉下面那只之后，上面的箱子必须落下来，不能悬空
  resettleAll();
  // 模型变了：删掉多余网格，同步剩下的
  const ids = new Set(model.boxes.map((b) => b.uid));
  meshes.forEach((m, uid) => {
    if (!ids.has(uid)) { scene.remove(m); meshes.delete(uid); }
  });
  model.boxes.forEach((b) => syncMesh(b));
  paintSelection();
  paintCount();
  renderSkuList();
}

/** 切柜型后重新校验：越界或过不了门高的标红，箱子不删 */
function revalidate() {
  const bad = [];
  model.boxes.forEach((b) => {
    const ok = CL.manual.inBounds(b, c);
    b.invalid = !ok;
    if (!ok) bad.push(b);
  });
  paintSelection();
  bad.forEach((b) => {
    const m = meshes.get(b.uid);
    if (m) m.material = BAD_MAT;
  });
  return bad;
}

function paintCount() {
  const cs = CL.manualModel.counts(model);
  document.getElementById('count').textContent =
    cs.map((x) => x.name + ' ' + x.placed + '/' + x.want).join(' · ') +
    (selected ? ' · 已选中 #' + selected : '');
}

function doRotate(axis) {
  if (!selected) { say('先点选一只箱子', true); return; }
  const r = CL.manualModel.rotate(model, selected, axis);
  if (!r.ok) { say('转不了：' + (r.message || r.reason), true); return; }
  refreshAll();
  say('已绕 ' + axis.toUpperCase() + ' 转 90°，高 ' + Math.round(r.box.h) + 'mm');
}

function doCopy() {
  if (!selected) { say('先点选一只箱子', true); return; }
  const r = CL.manualModel.copy(model, selected);
  if (!r.ok) { say('复制不了：' + (r.message || r.reason), true); return; }
  selected = r.box.uid;
  refreshAll();
  say('已复制一只（共 ' + model.boxes.length + ' 只）');
}

function doUndo() {
  const r = CL.manualModel.undo(model);
  if (!r.ok) { say('没有可撤销的操作', true); return; }
  if (!model.boxes.some((b) => b.uid === selected)) selected = null;
  refreshAll();
  say('已撤销（共 ' + model.boxes.length + ' 只）');
}

['x', 'y', 'z'].forEach((axis) => {

});

/** 对扣：选中一只，自动生成翻 180° 的配对件，位置按几何算，不靠手拖 */
function doPair() {
  const b = model.boxes.find((x) => x.uid === selected);
  if (!b) { say('先选中一只箱子再点对扣', true); return; }
  const it = itemsById[b.skuId];
  const sv = it && it.shapeValues;
  if (!sv) { say('这只箱子没有几何数据，无法对扣', true); return; }
  if (it.shape === 'rect') { say('矩形箱不需要对扣', true); return; }
  if (it.shape === 'lshape' && Math.abs(sv.wlow - sv.whigh) > 1) {
    say('这只 L 形箱台阶不对称：W低 ' + Math.round(sv.wlow) + ' / W高 ' + Math.round(sv.whigh) +
      '，两只对扣会互相穿插（差 ' + Math.round(Math.abs(sv.wlow - sv.whigh)) + 'mm），请用配套箱填缺口', true);
    return;
  }
  // 上件姿态与偏移一律由几何算：findFlipPose 给姿态，pairFit 在高度上搜出"零重叠零缝隙"的那个 z
  const flip = CL.pack.findFlipPose(it, { m: b.pose || [1, 0, 0, 0, 1, 0, 0, 0, 1] });
  if (!flip) { say('这只箱子没有可用的对扣姿态', true); return; }
  let cand = null, best = null;
  for (let dz = 0; dz + flip.thickness <= c.innerH + 0.5; dz += 10) {
    const trial = {
      skuId: b.skuId, x: b.x, y: b.y, z: b.z + dz,
      l: flip.fx, w: flip.fy, h: flip.thickness, pose: flip.m
    };
    const fit = CL.solid.pairFit(
      { skuId: b.skuId, x: b.x, y: b.y, z: b.z, l: b.l, w: b.w, h: b.h, pose: b.pose },
      trial, it, { step: 10, tol: 1 }
    );
    if (fit.overlap <= 1 && fit.gap <= 1) { cand = trial; best = fit; break; }
  }
  if (!cand) { say('对扣放不下：这段高度里找不到严丝合缝的位置', true); return; }
  if (!CL.manual.inBounds(cand, c)) { say('对扣放不下：会超出柜内腔或门高', true); return; }
  const others = model.boxes.filter((x) => x.uid !== b.uid);
  for (const o of others) {
    const oi = itemsById[o.skuId];
    const depth = (CL.solid && CL.solid.overlapDepth) ? CL.solid.overlapDepth(cand, o, it, oi, 10) : 0;
    if (depth > 1) { say('对扣放不下：这个位置上已有箱子挡住（重叠 ' + Math.round(depth) + 'mm）', true); return; }
  }
  cand.uid = model.nextId++;
  cand.pinned = true;          // 对扣上件：重力结算不重算它的高度，否则会被吸到顶面
  cand.pairedWith = b.uid;
  b.paired = true;
  model.boxes.push(cand);
  selected = cand.uid;
  refreshAll();
  say('已对扣：拼合后总高 ' + Math.round(sv.hlow + sv.hhigh) + 'mm，上面可以继续叠箱');
}
document.getElementById('un').addEventListener('click', doUndo);

// 快捷键只在画布有焦点时生效，且 preventDefault，避免吃掉页面的复制
function canvasFocused() {
  const el = document.activeElement;
  return el === renderer.domElement || el === document.body || el === null;
}
addEventListener('keydown', (ev) => {
  if (!canvasFocused()) return;
  const k = ev.key.toLowerCase();
  if ((ev.ctrlKey || ev.metaKey) && k === 'z') { ev.preventDefault(); doUndo(); return; }
  if ((ev.ctrlKey || ev.metaKey) && k === 'c') { ev.preventDefault(); if (selected) say('已记录 #' + selected); return; }
  if ((ev.ctrlKey || ev.metaKey) && k === 'v') { ev.preventDefault(); doCopy(); return; }
  if (k === '1') { ev.preventDefault(); doRotate('x'); }
  if (k === '2') { ev.preventDefault(); doRotate('y'); }
  if (k === '3') { ev.preventDefault(); doRotate('z'); }
});

// ---- 左栏：箱型列表 / 新建 / 往柜里加一只 ----
let currentSku = null;
let formShape = 'rect';

function toItem(id, shapeKey, name, values, qty) {
  const shape = CL.shapes.get(shapeKey);
  const v = {};
  shape.fields.forEach((f) => {
    v[f.key] = String(values && values[f.key] !== undefined && values[f.key] !== '' ? values[f.key] : shape.defaults[f.key]);
  });
  const bb = shape.bbox(v);
  const n = CL.shapes.toNum;
  const sv = shapeKey === 'lshape'
    ? { l: n(v.L), w: n(v.W), h: bb.h, wlow: n(v.Wlow), whigh: n(v.Whigh), hlow: n(v.Hlow), hhigh: n(v.Hhigh) }
    : shapeKey === 'slope'
      ? { l: n(v.L), w: n(v.W), h: bb.h, hlow: n(v.Hlow), hhigh: n(v.Hhigh) }
      : { l: n(v.L), w: n(v.W), h: bb.h };
  return {
    id, index: model.items.length, shape: shapeKey, shapeName: shape.name,
    name: name || shape.name, values: v, rawValues: v, bbox: bb, shapeValues: sv,
    qty: Math.max(0, Number(qty) || 0), allowFlip: true, allowSide: true
  };
}

function addSku(spec) {
  const shape = CL.shapes.get(spec.shape);
  const errs = shape.checks(spec.values || {});
  if (errs && errs.length) return { ok: false, message: errs[0] };
  const id = spec.id || ('s' + (model.items.length + 1) + '-' + Math.random().toString(36).slice(2, 6));
  const it = toItem(id, spec.shape, spec.name, spec.values, spec.qty);
  model.items.push(it);
  model.itemsById[it.id] = it;
  renderSkuList();
  return { ok: true, item: it };
}

function summarise(it) {
  const b = it.bbox;
  let s = Math.round(b.l) + '×' + Math.round(b.w) + '×' + Math.round(b.h);
  if (it.shape === 'lshape') s = Math.round(b.l) + '×' + Math.round(b.w) + ' · 台阶 ' + Math.round(it.shapeValues.wlow) + '/' + Math.round(it.shapeValues.whigh);
  if (it.shape === 'slope') s = Math.round(b.l) + '×' + Math.round(b.w) + ' · 斜顶 ' + Math.round(it.shapeValues.hlow) + '/' + Math.round(b.h);
  return s;
}

function renderSkuList() {
  const list = document.getElementById('sku-list');
  const empty = document.getElementById('empty');
  const cs = CL.manualModel.counts(model);
  empty.style.display = cs.length ? 'none' : 'block';
  list.innerHTML = '';
  cs.forEach((x) => {
    const it = itemsById[x.skuId];
    if (!it) return;
    const row = document.createElement('div');
    row.className = 'sku' + (currentSku === it.id ? ' on' : '');
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = '#' + colorFor(it.id).getHexString();
    row.innerHTML =
      '<div class="nm"><span class="dot"></span><span class="nmx"></span></div><div class="meta"></div>' +
      '<div class="row2"><button class="btn" data-add="1">＋</button>' +
      '<button class="btn ghost" data-edit="1">改</button>' +
      '<button class="btn ghost" data-del="1">删</button><span class="cnt"></span></div>';
    row.querySelector('.nmx').textContent = it.name;
    row.querySelector('.meta').textContent = summarise(it);
    row.querySelector('.cnt').textContent = x.placed + '/' + x.want;
    row.querySelector('[data-add]').addEventListener('click', (ev) => { ev.stopPropagation(); addOne(it.id); });
    row.querySelector('[data-edit]').addEventListener('click', (ev) => { ev.stopPropagation(); openEdit(it.id); });
    row.querySelector('[data-del]').addEventListener('click', (ev) => { ev.stopPropagation(); removeSku(it.id); });
    row.addEventListener('click', () => { currentSku = it.id; renderSkuList(); });
    list.appendChild(row);
  });
}

/** 删箱型：连同它已经放进柜里的箱子一起删（否则会留下没有箱型的孤儿箱） */
function removeSku(skuId) {
  const it = itemsById[skuId];
  if (!it) return;
  const placed = model.boxes.filter((b) => b.skuId === skuId).length;
  if (placed && !confirm('「' + it.name + '」已经放进柜里 ' + placed + ' 只，删掉这个箱型会一起删掉它们，继续？')) return;
  model.boxes = model.boxes.filter((b) => b.skuId !== skuId);
  model.items = model.items.filter((x) => x.id !== skuId);
  delete model.itemsById[skuId];
  delete itemsById[skuId];
  dropGeo(skuId);
  if (currentSku === skuId) currentSku = null;
  if (editingSku === skuId) { editingSku = null; document.getElementById('form').classList.remove('on'); }
  refreshAll();
  say('已删除箱型：' + it.name + '（同时移除 ' + placed + ' 只已放的箱子）');
}

/** 改箱型：尺寸/数量/名称都能改；已放进柜的同款箱子按新尺寸重摆，摆不下就标红 */
function updateSku(id, values, qty, name) {
  const it = itemsById[id];
  if (!it) return { ok: false, message: '箱型不存在' };
  const shape = CL.shapes.get(it.shape);
  const errs = shape.checks(values);
  if (errs && errs.length) return { ok: false, message: errs[0] };
  const fresh = toItem(id, it.shape, name || it.name, values, qty);
  fresh.index = it.index;
  Object.assign(it, fresh);
  dropGeo(id);
  // 已摆的箱子换成新尺寸：能放下就留，放不下标红（不悄悄删）
  model.boxes = model.boxes.map((b) => {
    if (b.skuId !== id) return b;
    const others = model.boxes.filter((x) => x.uid !== b.uid);
    const r = CL.manual.tryPlace(
      { skuId: id, x: b.x, y: b.y, z: b.z, l: it.bbox.l, w: it.bbox.w, h: it.bbox.h },
      others, c, itemsById
    );
    if (r.ok) return Object.assign(r.box, { uid: b.uid });
    return Object.assign({}, b, { l: it.bbox.l, w: it.bbox.w, h: it.bbox.h, invalid: true });
  });
  refreshAll();
  const bad = model.boxes.filter((b) => b.skuId === id && b.invalid).length;
  say('已更新箱型：' + it.name + (bad ? '，其中 ' + bad + ' 只按新尺寸放不下，已标红' : ''));
  return { ok: true, item: it };
}

/** 几何缓存里丢掉某个箱型的（尺寸改了必须丢，否则还按旧尺寸画） */
function dropGeo(skuId) {
  Array.from(geoCache.keys()).forEach((k) => { if (k.indexOf(skuId + '|') === 0) geoCache.delete(k); });
}

/** 在柜里找一个真正放得下的空位（先低后高、先近门后往里），不再一律扔到 (0,0,0) */
function findSpot(it) {
  const stepX = Math.max(50, Math.round(it.bbox.l / 2));
  const stepY = Math.max(50, Math.round(it.bbox.w / 2));
  let tries = 0;
  for (let x = 0; x + it.bbox.l <= c.innerL + 0.5; x += stepX) {
    for (let y = 0; y + it.bbox.w <= c.innerW + 0.5; y += stepY) {
      if (++tries > 600) return null;
      const r = CL.manual.tryPlace(
        { skuId: it.id, x, y, z: 0, l: it.bbox.l, w: it.bbox.w, h: it.bbox.h },
        model.boxes, c, itemsById
      );
      if (r.ok) return r;
    }
  }
  return null;
}

/** 往柜里加一只：先过门高，再找空位，最后由模型做沉降/吸附/判定 */
function addOne(skuId) {
  const it = itemsById[skuId];
  if (!it) return;
  if (it.bbox.h > c.doorH + 0.5) {
    say('放不进：箱高 ' + Math.round(it.bbox.h) + 'mm 超过 ' + ctnSel.value + ' 门高 ' + c.doorH + 'mm', true);
    return;
  }
  const spot = findSpot(it);
  if (!spot) { say('放不进：柜内已没有能放下 ' + it.name + ' 的空位', true); return; }
  const r = CL.manualModel.add(model, { skuId, x: spot.box.x, y: spot.box.y, z: spot.box.z, l: it.bbox.l, w: it.bbox.w, h: it.bbox.h });
  if (!r.ok) { say('放不进：' + (r.message || r.reason), true); return; }
  selected = r.box.uid;
  currentSku = it.id;
  refreshAll();
  say('已放入一只 ' + it.name + '（x=' + Math.round(r.box.x) + ' y=' + Math.round(r.box.y) + '），共 ' + model.boxes.length + ' 只');
}

/** 打开表单：editingId 为 null 是新建，否则是改旧箱型 */

    paintForm();
  });
});
document.getElementById('f-cancel').addEventListener('click', () => {
  closeForm();
});
document.getElementById('f-save').addEventListener('click', () => {
  const shape = CL.shapes.get(formShape);
  const values = {};
  document.querySelectorAll('#fields input').forEach((i) => { values[i.dataset.key] = i.value.trim(); });
  const qty = document.getElementById('f-qty').value.trim();
  const nameInput = document.getElementById('f-name').value.trim();
  const errEl = document.getElementById('f-err');
  const errs = shape.checks(values);
  if (errs && errs.length) { errEl.textContent = errs[0]; return; }
  if (!(Number(qty) > 0)) { errEl.textContent = '数量要大于 0'; return; }
  if (editingSku) {
    const r = updateSku(editingSku, values, qty, nameInput);
    if (!r.ok) { errEl.textContent = r.message || '保存失败'; return; }
    errEl.textContent = '';
    currentSku = editingSku;
    closeForm();
    renderSkuList();
    return;
  }
  const r = addSku({ shape: formShape, values, qty, name: nameInput || shape.name });
  if (!r.ok) { errEl.textContent = r.message || '保存失败'; return; }
  errEl.textContent = '';
  closeForm();
  currentSku = r.item.id;
  renderSkuList();
  say('已新建箱型：' + r.item.name + ' ' + summarise(r.item));
});

// Delete / Backspace 删掉选中箱
addEventListener('keydown', (ev) => {
  if (!canvasFocused()) return;
  if (ev.key !== 'Delete' && ev.key !== 'Backspace') return;
  if (!selected) return;
  ev.preventDefault();
  const r = CL.manualModel.remove(model, selected);
  if (!r.ok) { say('删不掉：' + (r.message || r.reason), true); return; }
  selected = null;
  refreshAll();
  say('已删除一只，剩 ' + model.boxes.length + ' 只');
});
renderSkuList();

// 把诊断数与两条验收写进页面，截图就能读到
setTimeout(() => {
  const s = stats();
  const t = window.__PROTO.selfTest();
  const t2 = window.__PROTO.selfTest2();
  document.getElementById('stat2').textContent =
    'children=' + s.children + ' · calls=' + s.calls + ' | 撞墙拒绝=' + (t.wallRejected ? '✓' : '✗') +
    ' 模型未变=' + (t.modelUnchanged ? '✓' : '✗') + ' | 落箱顶=' + (t.onTopOk && t.onTopZ === 300 ? '✓' : '✗') +
    ' | 复制+2=' + (t2.copyGrew ? '✓' : '✗') + ' 计数一致=' + (t2.countMatches ? '✓' : '✗') +
    ' 旋转生效=' + (t2.rotated ? '✓' : '✗') + ' 撤销回原=' + (t2.undoBack ? '✓' : '✗');
  paintCount();
}, 900);
</script>
